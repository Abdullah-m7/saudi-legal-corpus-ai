name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (test, validate, render extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,validate,render]"

      - name: Validate corpus (schema + legal-translation QA)
        run: make validate

      - name: Run tests
        run: make test

      - name: Render searchable HTML book
        run: make html

      - name: Build JSONL RAG chunks
        run: make jsonl

      # NOTE: PDF generation (WeasyPrint) is intentionally NOT run in CI because it
      # requires native libraries (pango/cairo/gdk-pixbuf). CI therefore makes NO
      # claim that the PDF builds here. HTML is the canonical searchable output and
      # is fully exercised above. To produce the PDF locally:
      #   pip install -e ".[pdf]" && make pdf

      - name: Upload HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book1-html-py${{ matrix.python-version }}
          path: dist/book1.html
          if-no-files-found: warn
