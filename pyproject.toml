[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-law-corpus"
version = "1.0.0"
description = "Saudi Companies Law — Arabic–Chinese reference translation corpus (Book One, Articles 1–34), structured-first with HTML/PDF rendering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdullah" }]
keywords = ["saudi", "companies-law", "arabic", "chinese", "legal-translation", "corpus", "rag", "llm"]

# Core runtime uses only the standard library. Rendering/validation extras are
# optional; the pipeline degrades gracefully when they are absent.
dependencies = []

[project.optional-dependencies]
render = ["jinja2>=3.0"]
pdf = ["weasyprint>=59"]
validate = ["jsonschema>=4.0"]
extract = ["pypdf>=3.0"]
test = ["pytest>=7.0"]
all = ["jinja2>=3.0", "weasyprint>=59", "jsonschema>=4.0", "pypdf>=3.0", "pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
